<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8个小灯控制</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }


  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0b0f1a;
    font-family: "Microsoft YaHei", Arial, sans-serif;
  }


  .box {
    background: #1a1f2e;
    padding: 40px 50px;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,.7);
    text-align: center;
  }


  h1 {
    color: #cfe0ff;
    font-size: 22px;
    font-weight: normal;
    letter-spacing: 2px;
    margin-bottom: 35px;
  }


  /* 8个灯排列 */
  .lamps {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 35px;
  }


  .lamp {
    width: 60px;
    text-align: center;
  }


  .circle {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #262d3d;
    border: 2px solid #333d52;
    box-shadow: inset 0 6px 10px rgba(0,0,0,.8);
    transition: all .2s;
    margin-bottom: 8px;
  }


  /* 灯亮起的状态 */
  .circle.on {
    background: radial-gradient(circle at 35% 35%, #fff8b0, #ffcc00);
    border-color: #ffe680;
    box-shadow: 0 0 20px #ffcc00, 0 0 40px #ff9900, inset 0 -3px 8px #fff8c0;
  }


  .num {
    color: #7a8aa8;
    font-size: 13px;
  }


  /* 输入区域 */
  .input-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-bottom: 25px;
  }


  .input-row label {
    color: #a8bcdc;
    font-size: 15px;
  }


  #numInput {
    width: 90px;
    padding: 10px;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    border: 2px solid #3f5070;
    border-radius: 10px;
    background: #232b3b;
    color: #fff;
    outline: none;
    font-family: Consolas, monospace;
  }


  #numInput:focus {
    border-color: #6d8fd1;
    box-shadow: 0 0 10px #3f6ac0;
  }


  /* 按钮 */
  .btn-row {
    display: flex;
    justify-content: center;
    gap: 14px;
  }


  button {
    padding: 10px 26px;
    font-size: 15px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    letter-spacing: 1px;
    transition: all .15s;
  }


  .btn-on {
    background: #3d7bfd;
    color: #fff;
  }
  .btn-on:hover { background: #558dff; }
  .btn-on:active { transform: scale(.96); }


  .btn-off {
    background: #3a2b34;
    color: #ffb0c8;
    border: 1px solid #5c3a4a;
  }
  .btn-off:hover { background: #4d3844; }
  .btn-off:active { transform: scale(.96); }


  .tip {
    color: #5c7090;
    font-size: 12px;
    margin-top: 20px;
  }
</style>
</head>
<body>


<div class="box">
  <h1>8 个小灯控制</h1>


  <!-- 8 个灯 -->
  <div class="lamps">
    <div class="lamp"><div class="circle" id="lamp1"></div><div class="num">1号</div></div>
    <div class="lamp"><div class="circle" id="lamp2"></div><div class="num">2号</div></div>
    <div class="lamp"><div class="circle" id="lamp3"></div><div class="num">3号</div></div>
    <div class="lamp"><div class="circle" id="lamp4"></div><div class="num">4号</div></div>
    <div class="lamp"><div class="circle" id="lamp5"></div><div class="num">5号</div></div>
    <div class="lamp"><div class="circle" id="lamp6"></div><div class="num">6号</div></div>
    <div class="lamp"><div class="circle" id="lamp7"></div><div class="num">7号</div></div>
    <div class="lamp"><div class="circle" id="lamp8"></div><div class="num">8号</div></div>
  </div>


  <!-- 输入 -->
  <div class="input-row">
    <label>输入编号(1~8)：</label>
    <input type="number" id="numInput" min="1" max="8" value="1">
  </div>


  <!-- 按钮 -->
  <div class="btn-row">
    <button class="btn-on" onclick="turnOn()">亮 灯</button>
    <button class="btn-off" onclick="turnOff()">全部熄灭</button>
  </div>


  <p class="tip">输入 1~8 的数字，点击"亮灯"即可点亮对应编号的小灯</p>
</div>


<script>
  // 获取 8 个灯泡元素，放在数组里
  var lamps = [
    document.getElementById('lamp1'),
    document.getElementById('lamp2'),
    document.getElementById('lamp3'),
    document.getElementById('lamp4'),
    document.getElementById('lamp5'),
    document.getElementById('lamp6'),
    document.getElementById('lamp7'),
    document.getElementById('lamp8')
  ];


  // 点亮指定编号的灯
  function turnOn() {
    var input = document.getElementById('numInput');
    var num = parseInt(input.value);


    // 判断输入是否有效
    if (isNaN(num) || num < 1 || num > 8) {
      alert('请输入 1 到 8 之间的数字！');
      return;
    }


    // 先全部熄灭
    for (var i = 0; i < 8; i++) {
      lamps[i].classList.remove('on');
    }


    // 点亮对应编号的灯（数组索引 = 编号 - 1）
    lamps[num - 1].classList.add('on');
  }


  // 全部熄灭
  function turnOff() {
    for (var i = 0; i < 8; i++) {
      lamps[i].classList.remove('on');
    }
  }


  // 按回车键也能亮灯
  document.getElementById('numInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      turnOn();
    }
  });
</script>


</body>
</html>
